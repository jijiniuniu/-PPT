<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智创PPT - 智能专业版</title>
    <script src="https://unpkg.com/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#eef2ff; font-family: system-ui, 'Segoe UI', sans-serif; padding:20px; }
        .container { max-width:1200px; margin:0 auto; background:white; border-radius:32px; padding:24px; box-shadow:0 8px 20px rgba(0,0,0,0.1); }
        h1 { font-size:1.8rem; margin-bottom:8px; }
        textarea { width:100%; padding:12px; border-radius:16px; border:1px solid #ccc; font-size:1rem; margin-top:12px; font-family:inherit; }
        .template-grid { display:flex; flex-wrap:wrap; gap:16px; margin:20px 0; }
        .template-card { background:#f8fafc; border-radius:20px; padding:12px; cursor:pointer; text-align:center; flex:1; min-width:120px; border:2px solid transparent; }
        .template-card.active { border-color:#3b82f6; background:#eff6ff; }
        .template-preview { height:80px; border-radius:16px; margin-bottom:8px; display:flex; align-items:center; justify-content:center; color:white; font-weight:bold; }
        button { background:#1e3a8a; color:white; border:none; padding:12px 24px; border-radius:40px; font-size:1rem; font-weight:bold; width:100%; cursor:pointer; margin-top:16px; }
        button:disabled { opacity:0.6; cursor:not-allowed; }
        .loading { display:none; text-align:center; margin-top:16px; }
        .spinner { display:inline-block; width:20px; height:20px; border:3px solid #ddd; border-top-color:#1e3a8a; border-radius:50%; animation:spin 0.6s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .error-msg { color:#b91c1c; background:#fee2e2; padding:8px 12px; border-radius:12px; margin-top:12px; display:none; }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ 智创PPT · 智能专业版</h1>
    <p>输入主题，自动生成10页左右专业PPT</p>
    <textarea id="instruction" rows="3" placeholder="例如：骨的组胚学、解剖学、胚胎学综合教学PPT，包含结构、功能、发育过程、临床关联。"></textarea>
    
    <div class="template-grid" id="templateList"></div>
    <button id="generateBtn">⚡ 一键生成丰富PPT</button>
    <div id="loading" class="loading"><div class="spinner"></div> 智能生成中，请稍候...</div>
    <div id="errorMsg" class="error-msg"></div>
</div>

<script>
    // 模板定义
    const templates = [
        { id: 'blue', name: '商务蓝', bgColor: '1E3A8A', titleColor: 'FFFFFF', textColor: 'F1F5F9' },
        { id: 'dark', name: '科技黑', bgColor: '0F172A', titleColor: 'F97316', textColor: 'E2E8F0' },
        { id: 'green', name: '清新绿', bgColor: '14532D', titleColor: 'FDE047', textColor: 'FEF9C3' }
    ];
    let currentTemplate = templates[0];

    // 检查库加载
    function checkLibraries() {
        if (typeof window.PptxGenJS === 'undefined') {
            document.getElementById('errorMsg').innerText = '❌ 生成库加载失败，请刷新页面重试。';
            document.getElementById('errorMsg').style.display = 'block';
            return false;
        }
        return true;
    }

    // 渲染模板选择
    function renderTemplates() {
        const grid = document.getElementById('templateList');
        grid.innerHTML = '';
        templates.forEach(tpl => {
            const card = document.createElement('div');
            card.className = `template-card ${currentTemplate.id === tpl.id ? 'active' : ''}`;
            card.innerHTML = `
                <div class="template-preview" style="background: #${tpl.bgColor};">${tpl.name}</div>
                <div>${tpl.name}</div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                currentTemplate = tpl;
            };
            grid.appendChild(card);
        });
    }

    // ---------- 智能内容生成器（大幅增强版） ----------
    function generateRichSlides(instruction) {
        const instr = instruction.trim() || "通用主题报告";
        const lowerInstr = instr.toLowerCase();
        
        // 检测主题类型
        let topicType = 'general';
        if (lowerInstr.includes('骨') || lowerInstr.includes('解剖') || lowerInstr.includes('胚胎') || lowerInstr.includes('医学')) topicType = 'medical';
        else if (lowerInstr.includes('人工') || lowerInstr.includes('ai') || lowerInstr.includes('科技')) topicType = 'tech';
        else if (lowerInstr.includes('商业') || lowerInstr.includes('市场') || lowerInstr.includes('营销')) topicType = 'business';
        else if (lowerInstr.includes('教育') || lowerInstr.includes('教学') || lowerInstr.includes('课程')) topicType = 'education';
        
        // 基础结构
        let slides = [];
        // 封面
        slides.push({ type: 'cover', title: instr.length > 40 ? instr.substring(0,40)+"…" : instr, subtitle: "专业报告 · 智创呈现" });
        
        // 目录
        slides.push({ type: 'content', title: "目录", items: ["1. 背景与意义", "2. 核心概念解析", "3. 深度分析与案例", "4. 关键数据洞察", "5. 挑战与对策", "6. 未来展望与总结"] });
        
        // 根据主题生成详细内容
        if (topicType === 'medical') {
            slides.push({ type: 'content', title: "一、骨骼系统概述", items: [
                "1. 骨的结构与分类：长骨、短骨、扁骨、不规则骨",
                "2. 骨的宏观结构：骨密质、骨松质、骨髓腔",
                "3. 骨的微观结构：骨单位（哈弗斯系统）、骨细胞",
                "4. 骨的功能：支撑、保护、运动、造血、矿物质储存"
            ] });
            slides.push({ type: 'content', title: "二、解剖学要点", items: [
                "1. 中轴骨：颅骨、脊柱、胸骨、肋骨",
                "2. 附肢骨：上肢骨（肩胛骨、肱骨、桡骨、尺骨等）",
                "3. 下肢骨（髋骨、股骨、胫骨、腓骨等）",
                "4. 重要骨性标志：乳突、肩峰、髂前上棘、内踝等"
            ] });
            slides.push({ type: 'content', title: "三、胚胎学发育", items: [
                "1. 骨的发生方式：膜内成骨（颅骨）与软骨内成骨（四肢骨）",
                "2. 骨化中心与生长板（骺板）的发育",
                "3. 胚胎期骨骼形成时间轴：第6周开始软骨雏形，第8周骨化",
                "4. 常见发育异常：先天性髋关节脱位、脊柱裂、成骨不全"
            ] });
            slides.push({ type: 'content', title: "四、临床关联与应用", items: [
                "1. 骨折愈合过程：血肿形成、纤维连接、骨痂形成、骨改建",
                "2. 骨质疏松症的病理与预防",
                "3. 骨肿瘤分类：良性（骨瘤）与恶性（骨肉瘤）",
                "4. 骨科植入物与生物力学"
            ] });
        } 
        else if (topicType === 'tech') {
            slides.push({ type: 'content', title: "一、技术演进与现状", items: [
                "1. 人工智能发展历程：符号主义 → 机器学习 → 深度学习 → 生成式AI",
                "2. 当前主流技术：Transformer架构、扩散模型、多模态大模型",
                "3. 关键技术突破：算力提升、海量数据、算法创新",
                "4. 国内外发展对比与竞争格局"
            ] });
            slides.push({ type: 'content', title: "二、应用场景与案例", items: [
                "1. 医疗健康：AI辅助诊断、药物发现",
                "2. 金融科技：智能风控、量化交易",
                "3. 智能制造：工业质检、预测性维护",
                "4. 内容创作：AIGC（文本/图像/视频生成）"
            ] });
            slides.push({ type: 'content', title: "三、挑战与伦理", items: [
                "1. 数据隐私与安全风险",
                "2. 算法偏见与公平性问题",
                "3. 监管法规与合规要求",
                "4. 就业冲击与人才培养"
            ] });
        }
        else if (topicType === 'business') {
            slides.push({ type: 'content', title: "一、市场环境分析", items: [
                "1. 宏观环境：PEST分析（政治、经济、社会、技术）",
                "2. 行业趋势：市场规模、增长率、竞争格局",
                "3. 用户需求洞察：消费升级、个性化、体验优先"
            ] });
            slides.push({ type: 'content', title: "二、核心战略与竞争策略", items: [
                "1. SWOT分析（优势、劣势、机会、威胁）",
                "2. 差异化定位与品牌建设",
                "3. 数字化营销与全渠道布局",
                "4. 供应链优化与成本控制"
            ] });
            slides.push({ type: 'content', title: "三、财务预测与ROI", items: [
                "1. 收入模型与盈利预测（未来3年）",
                "2. 成本结构分析",
                "3. 投资回报率测算",
                "4. 风险应对与应急方案"
            ] });
        }
        else if (topicType === 'education') {
            slides.push({ type: 'content', title: "一、教育理念与目标", items: [
                "1. 核心素养导向：批判性思维、创造力、合作能力",
                "2. 个性化学习与差异化教学",
                "3. 终身学习能力培养"
            ] });
            slides.push({ type: 'content', title: "二、创新教学方法", items: [
                "1. 项目式学习（PBL）案例",
                "2. 翻转课堂与混合式教学",
                "3. 游戏化学习与情境模拟",
                "4. 教育科技工具应用"
            ] });
            slides.push({ type: 'content', title: "三、评估与改进机制", items: [
                "1. 多元化评价体系（过程性+终结性）",
                "2. 数据驱动的教学决策",
                "3. 教师专业发展支持",
                "4. 家校社协同共育"
            ] });
        }
        else { // 通用主题
            slides.push({ type: 'content', title: "一、背景与现状", items: [
                "1. 行业发展历程回顾",
                "2. 当前面临的主要挑战",
                "3. 政策与市场机遇"
            ] });
            slides.push({ type: 'content', title: "二、核心问题剖析", items: [
                "1. 关键痛点识别",
                "2. 根本原因分析（鱼骨图）",
                "3. 利益相关者影响"
            ] });
            slides.push({ type: 'content', title: "三、解决方案与实施路径", items: [
                "1. 策略设计原则",
                "2. 分阶段实施计划",
                "3. 资源需求与预算"
            ] });
            slides.push({ type: 'content', title: "四、预期成果与价值", items: [
                "1. 短期收益（3-6个月）",
                "2. 长期影响（1-3年）",
                "3. 可持续性与复制潜力"
            ] });
        }
        
        // 总结展望
        slides.push({ type: 'content', title: "总结与展望", items: [
            "1. 核心结论回顾",
            "2. 未来发展趋势预测",
            "3. 行动建议与下一步计划"
        ] });
        // 致谢
        slides.push({ type: 'thankyou', title: "感谢聆听", subtitle: "Q & A" });
        
        return slides;
    }

    // 导出PPT
    async function exportPPT(slides, style) {
        const PptxGenJS = window.PptxGenJS;
        const pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_WIDE';
        pptx.defineLayout({ name: 'WIDE', width: 10, height: 5.625 });
        pptx.layout = 'WIDE';

        for (let slideData of slides) {
            const slide = pptx.addSlide();
            slide.background = { fill: style.bgColor };
            if (slideData.type === 'cover') {
                slide.addText(slideData.title, { x: 0.5, y: 1.5, w: 9, h: 1.2, fontSize: 36, bold: true, color: style.titleColor, align: 'center' });
                slide.addText(slideData.subtitle, { x: 0.5, y: 3.0, w: 9, h: 0.8, fontSize: 18, color: style.textColor, align: 'center' });
            } else if (slideData.type === 'thankyou') {
                slide.addText(slideData.title, { x: 0.5, y: 2.2, w: 9, h: 1.2, fontSize: 44, bold: true, color: style.titleColor, align: 'center' });
                slide.addText(slideData.subtitle || "欢迎交流", { x: 0.5, y: 3.5, w: 9, h: 0.8, fontSize: 20, color: style.textColor, align: 'center' });
            } else {
                slide.addText(slideData.title, { x: 0.5, y: 0.3, w: 9, h: 0.8, fontSize: 28, bold: true, color: style.titleColor });
                // 将字符串数组转换为带项目符号的文本对象
                const items = slideData.items.map(text => ({ text: text, options: { bullet: true, fontSize: 16, color: style.textColor, indentLevel: 0 } }));
                slide.addText(items, { x: 0.8, y: 1.2, w: 8.4, h: 4.0 });
            }
        }
        await pptx.writeFile({ fileName: `智创PPT_${Date.now()}.pptx` });
    }

    // 生成按钮事件
    document.getElementById('generateBtn').onclick = async () => {
        document.getElementById('errorMsg').style.display = 'none';
        if (!checkLibraries()) return;

        const instruction = document.getElementById('instruction').value;
        if (!instruction.trim()) {
            alert("请输入PPT主题");
            return;
        }
        const loadingDiv = document.getElementById('loading');
        const btn = document.getElementById('generateBtn');
        loadingDiv.style.display = 'block';
        btn.disabled = true;
        try {
            const slides = generateRichSlides(instruction);
            const style = {
                bgColor: currentTemplate.bgColor,
                titleColor: currentTemplate.titleColor,
                textColor: currentTemplate.textColor
            };
            await exportPPT(slides, style);
        } catch (err) {
            alert("生成失败：" + err.message);
            console.error(err);
        } finally {
            loadingDiv.style.display = 'none';
            btn.disabled = false;
        }
    };

    window.addEventListener('load', () => {
        checkLibraries();
    });
    renderTemplates();
</script>
</body>
</html>
