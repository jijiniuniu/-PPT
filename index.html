<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>智创PPT - 一键生成</title>
    <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #eef2ff;
            font-family: system-ui, 'Segoe UI', sans-serif;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 32px;
            padding: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 16px;
            border: 1px solid #ccc;
            font-size: 1rem;
            margin-top: 12px;
        }
        .template-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 20px 0;
        }
        .template-card {
            background: #f8fafc;
            border-radius: 20px;
            padding: 12px;
            cursor: pointer;
            text-align: center;
            flex: 1;
            min-width: 120px;
            border: 2px solid transparent;
        }
        .template-card.active {
            border-color: #3b82f6;
            background: #eff6ff;
        }
        .template-preview {
            height: 80px;
            background: linear-gradient(145deg, #0f172a, #1e293b);
            border-radius: 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }
        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-top: 16px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 16px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #ddd;
            border-top-color: #1e3a8a;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="container">
    <h1>✨ 智创PPT · 一键生成</h1>
    <p>输入主题，自动生成PPT</p>
    <textarea id="instruction" rows="3" placeholder="例如：人工智能发展趋势，包含技术、应用、挑战"></textarea>
    
    <div class="template-grid" id="templateList"></div>
    <button id="generateBtn">⚡ 一键生成PPT</button>
    <div id="loading" class="loading"><div class="spinner"></div> 生成中，请稍候...</div>
</div>

<script>
    // 模板定义
    const templates = [
        { id: 'blue', name: '商务蓝', bgColor: '1E3A8A', titleColor: 'FFFFFF', textColor: 'F1F5F9' },
        { id: 'dark', name: '科技黑', bgColor: '0F172A', titleColor: 'F97316', textColor: 'E2E8F0' },
        { id: 'green', name: '清新绿', bgColor: '14532D', titleColor: 'FDE047', textColor: 'FEF9C3' }
    ];
    let currentTemplate = templates[0];

    // 渲染模板选择
    function renderTemplates() {
        const grid = document.getElementById('templateList');
        grid.innerHTML = '';
        templates.forEach(tpl => {
            const card = document.createElement('div');
            card.className = `template-card ${currentTemplate.id === tpl.id ? 'active' : ''}`;
            card.innerHTML = `
                <div class="template-preview" style="background: #${tpl.bgColor};">${tpl.name}</div>
                <div>${tpl.name}</div>
            `;
            card.onclick = () => {
                document.querySelectorAll('.template-card').forEach(c => c.classList.remove('active'));
                card.classList.add('active');
                currentTemplate = tpl;
            };
            grid.appendChild(card);
        });
    }

    // 智能生成内容（根据用户输入）
    function generateSlides(instruction) {
        let title = instruction.trim() || "通用主题报告";
        if (title.length > 30) title = title.substring(0, 30) + "…";
        return [
            { type: 'cover', title: title, subtitle: "一键生成 · 智能排版" },
            { type: 'content', title: "核心要点", items: ["行业背景", "机遇挑战", "未来展望"] },
            { type: 'content', title: "数据洞察", items: ["趋势分析", "竞争格局", "用户需求"] },
            { type: 'content', title: "行动建议", items: ["短期策略", "长期规划"] },
            { type: 'thankyou', title: "感谢聆听" }
        ];
    }

    // 导出PPT
    async function exportPPT(slides, style) {
        const PptxGenJS = window.PptxGenJS;
        const pptx = new PptxGenJS();
        pptx.layout = 'LAYOUT_WIDE';
        pptx.defineLayout({ name: 'WIDE', width: 10, height: 5.625 });
        pptx.layout = 'WIDE';

        for (let slideData of slides) {
            const slide = pptx.addSlide();
            slide.background = { fill: style.bgColor };
            if (slideData.type === 'cover') {
                slide.addText(slideData.title, { x: 0.5, y: 1.5, w: 9, h: 1, fontSize: 36, bold: true, color: style.titleColor, align: 'center' });
                slide.addText(slideData.subtitle, { x: 0.5, y: 3, w: 9, h: 0.8, fontSize: 18, color: style.textColor, align: 'center' });
            } else if (slideData.type === 'thankyou') {
                slide.addText(slideData.title, { x: 0.5, y: 2.5, w: 9, h: 1, fontSize: 40, bold: true, color: style.titleColor, align: 'center' });
            } else {
                slide.addText(slideData.title, { x: 0.5, y: 0.3, w: 9, h: 0.8, fontSize: 28, bold: true, color: style.titleColor });
                const items = slideData.items.map(item => ({ text: item, options: { bullet: true, fontSize: 18, color: style.textColor } }));
                slide.addText(items, { x: 0.8, y: 1.2, w: 8.4, h: 3.5 });
            }
        }
        await pptx.writeFile({ fileName: `智创PPT_${Date.now()}.pptx` });
    }

    document.getElementById('generateBtn').onclick = async () => {
        const instruction = document.getElementById('instruction').value;
        if (!instruction.trim()) {
            alert("请输入PPT主题");
            return;
        }
        const loadingDiv = document.getElementById('loading');
        const btn = document.getElementById('generateBtn');
        loadingDiv.style.display = 'block';
        btn.disabled = true;
        try {
            const slides = generateSlides(instruction);
            const style = {
                bgColor: currentTemplate.bgColor,
                titleColor: currentTemplate.titleColor,
                textColor: currentTemplate.textColor
            };
            await exportPPT(slides, style);
        } catch (err) {
            alert("生成失败：" + err.message);
            console.error(err);
        } finally {
            loadingDiv.style.display = 'none';
            btn.disabled = false;
        }
    };

    renderTemplates();
</script>
</body>
</html>
